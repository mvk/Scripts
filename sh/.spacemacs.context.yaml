---
default_font_family: Source Code Pro
default_font_size: 16.0
emacs_enable_server: t
emacs_editing_style: emacs
dotspacemacs_configuration_layers:
  - |-
    ;; ----------------------------------------------------------------
    ;; Example of useful layers you may want to use right away.
    ;; Uncomment some layer names and press `SPC f e R' (Vim style) or
    ;; `M-m f e R' (Emacs style) to install them.
    ;; ----------------------------------------------------------------
  - |-
    (common-lisp :variables
                 common-lisp-backend 'sly
                 inferior-lisp-program "sbcl")
  - |-
    (haskell :variables
             haskell-completion-backend 'lsp
             lsp-haskell-process-path-hie "haskell-language-server-wrapper")
  - |-
    (rust :variables
          rust-backend 'lsp)
  - |-
    (shell :variables
           shell-default-shell 'vterm
           shell-default-height 30
           shell-default-position 'bottom)
  - syntax-checking
  - lsp
  - toml
  - yaml
  - ansible
  - auto-completion
  - emacs-lisp
  - helm
  - markdown
  - multiple-cursors
  - org
  - treemacs
dotspacemacs_additional_packages:
  - sly
#  - rewrap
dotspacemacs_user_config:
  - |-
    (use-package sly
      :defer t
      :config
      (setq sly-net-coding-system 'utf-8-unix))
  - |-
    (defvar user-home-venvs-root "~/.local/pythons"
      "Root folder for default virtual environments.")
    (defvar ansible-default-venv "ansible-default"
      "The default virtual environment folder name for Ansible.")
  - |-
    ;; Setup ansible-vault-password-file dynamically
    (defun local-ansible-set-vault-password ()
      "Dynamically set ansible vault password based on the current Projectile project."
      (let* ((global-default "~/.ansible_global_vault_pass")
            ;; Check if we are inside an active Projectile project
            (project-root (and (fboundp 'projectile-project-root)
                               (projectile-project-root)))
            ;; Look for a password file named '.vault_pass' at the root of the project
            (project-specific-pass (when project-root
                                     (concat project-root ".vault_pass"))))
        (if (and project-specific-pass (file-exists-p project-specific-pass))
            (setq-local ansible-vault-password-file project-specific-pass)
          (setq-local ansible-vault-password-file global-default))))
     
    (defun local-ansible-set-virtualenv-path ()
      "Prioritizes the project root .venv if it exists, or falls back to a global default."
      (let* (;; Construct the value of global-default-venv
              (global-default-venv (expand-file-name ansible-default-venv user-home-venvs-root))
              ;; Resolve the active Projectile root path
              (project-root (and (fboundp 'projectile-project-root)
                                (projectile-project-root)))
              ;; Look for a local .venv folder at that project root
              (local-venv (when project-root
                            (concat project-root ".venv")))
              ;; Determine the final choice: Local if found, otherwise Global
              (chosen-venv (if (and local-venv (file-directory-p local-venv))
                              local-venv
                            global-default-venv))
              ;; Build the executable binary directory path string
              (venv-bin (concat (file-name-as-directory chosen-venv) "bin")))

        ;; Check if the resolved bin directory actually exists before assigning
        (when (file-directory-p venv-bin)
          ;; 1. Update buffer-local exec-path so Emacs subprocesses see it first
          (setq-local exec-path (cons venv-bin exec-path))
          ;; 2. Update buffer-local PATH string for external linters & language servers
          (setenv "PATH" (concat venv-bin ":" (getenv "PATH"))))))
    
    (defun local-yaml-ansible-setup ()
      "Bundled initialization steps for YAML and Ansible files."
      (local-ansible-set-vault-password)    ; Step A: Determine vault keys
      (local-ansible-set-virtualenv-path)   ; Step B: Shift PATH execution to .venv
      (ansible))                            ; Step C: Start the minor mode

    ;; Assign the entire sequence into a single clean hook expression
    (add-hook 'yaml-mode-hook #'local-ansible-setup)

  # - |
  #   (use-package rewrap
  #     :defer t
  #     :init
  #     (add-hook 'text-mode-hook 'turn-on-rewrap-mode))
  - |-
    (defun local-scheduled-package-refresh ()
      "Runs package refresh only if it has been more than 7 days since the last run."
      (interactive)
      (let* ((cache-file (expand-file-name "elpa-refresh-timestamp" user-emacs-directory))
             (last-run (if (file-exists-p cache-file)
                           (with-temp-buffer
                             (insert-file-contents cache-file)
                             (car (read-from-string (buffer-string))))
                         nil))
             ;; Calculate days passed (86400 seconds in a day)
             (days-passed (if last-run
                              (/ (float-time (time-subtract (current-time) last-run)) 86400)
                            999))) ; Force run if no file exists

        (when (>= days-passed 7) ; Change 7 to 14 for a bi-weekly schedule
          (message "Scheduled weekly package refresh starting...")
          ;; Use our previous function to bypass the startup lock safely
          (my-force-package-refresh)
          ;; Save the current timestamp to the file
          (with-temp-file cache-file
            (insert (prin1-to-string (current-time))))
          (message "Scheduled package refresh complete."))))
  - |-

    ;; Run the schedule automatically in the background after Emacs is idle for 5 minutes
    (run-with-idle-timer 300 t #'local-scheduled-package-refresh)

