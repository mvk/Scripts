---

packages_standard:
  - comment: "tidal cycles"
    name: tidal
  - comment: "Nu-shell mode"
    name: nushell-mode
  - comment: "Mermaid diagrams support"
    name: mermaid-mode
  - comment: "Org-Mode Mermaid support"
    name: ob-mermaid
  - comment: "Org contrib"
    name: org-contrib
  - comment: "Modern org-mode look"
    name: org-modern
  - comment: "Show formatting characters visible when editing"
    name: org-appear

# packages_recipe: []
packages_recipe:
  - name: org
    recipe:
      host: nil
      repo: https://git.savannah.gnu.org/git/emacs/org-mode.git
      branch: main
      files:
        - "*"
        - "doc/org.text"
        - "lisp/*.el"
    pin: nil
