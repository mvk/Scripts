<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Assign Noto Sans Phoenician as the primary font for Phoenician language/script -->
  <match target="pattern">
    <test name="charset" compare="contains">
      <charset>
        <int>0x10900</int>
      </charset>      
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Phoenician</string>
    </edit>
  </match>
</fontconfig>
